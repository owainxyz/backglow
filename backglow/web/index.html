<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>backglow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">backglow</div>
      <div class="brand-subtitle" id="version">v0.0.0</div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-page="fx"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2Z"/></svg><span>Light FX</span></button>
      <button class="nav-item" data-page="device"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>Monitor</span></button>
    </nav>
    <div class="footer">
      <div class="conn bad" id="conn">Offline</div>
      <div class="device-count" id="connSub">No monitor</div>
    </div>
  </aside>

  <main class="main">
    <section class="page active" id="page-fx">
      <header class="page-header">
        <div>
          <h1>Light FX</h1>
          <p class="sub" id="fxSub"></p>
        </div>
        <div class="actions">
          <button class="btn" id="reloadBtn"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>Reload</button>
          <button class="btn primary" id="powerBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg><span id="powerLabel">Turn off</span></button>
        </div>
      </header>

      <div class="fx-top">
        <div class="card">
          <div class="card-head"><h2>Colour</h2></div>
          <div class="seg" id="pattern"></div>
          <div class="custom" id="custom">
            <div class="picker-row">
              <label class="sw big" id="bgSw"><input type="color" id="bgColor" value="#ff5900"><span></span></label>
              <div class="picker-text"><span class="label">Primary</span><span class="mono" id="bgHex">#ff5900</span></div>
            </div>
            <div class="swatches" id="presets"></div>
            <div class="picker-row">
              <label class="sw big" id="fgSw"><input type="color" id="fgColor" value="#808080"><span></span></label>
              <div class="picker-text"><span class="label">Secondary</span><span class="mono" id="fgHex">#808080</span></div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h2>Brightness</h2></div>
          <div class="seg" id="strength"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Effect</h2></div>
        <div class="modes" id="modes"></div>
      </div>
    </section>

    <section class="page" id="page-device">
      <header class="page-header">
        <div><h1>Monitor</h1><p class="sub" id="devSub">—</p></div>
      </header>
      <div class="cards-2">
        <div class="card">
          <div class="card-head"><h2>Info</h2></div>
          <div id="devInfo"></div>
        </div>
        <div class="card">
          <div class="card-head"><h2>Access</h2><span class="pill" id="permPill">—</span></div>
          <pre class="code" id="rule">KERNEL=="i2c-[0-9]*", SUBSYSTEM=="i2c-dev", TAG+="uaccess"</pre>
          <button class="btn" id="copyRule"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy rule</button>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
