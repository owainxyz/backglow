[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backglow"
version = "0.1.0"
description = "Light FX control for AOC AGON monitors over DDC/CI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyGObject", "pywebview"]

[project.scripts]
backglow = "backglow.app:main"

[tool.setuptools]
packages = ["backglow"]

[tool.setuptools.package-data]
backglow = ["web/*"]
