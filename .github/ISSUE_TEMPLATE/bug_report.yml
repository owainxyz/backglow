name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open backglow
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: backglow version
      placeholder: "backglow --version"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Monitor model
      description: Shown on the Monitor page, or `backglow --status`.
      placeholder: AG276QKD2
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and desktop
      placeholder: NixOS 26.05, Hyprland
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - nix run / nix profile
        - NixOS module
        - pip
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output from running `backglow` in a terminal, and `ls -l /dev/i2c-*`.
      render: text
